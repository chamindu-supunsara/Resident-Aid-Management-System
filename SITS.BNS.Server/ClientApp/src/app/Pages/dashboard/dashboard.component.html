<div>
    <div class="col-12">
        <p-card header="Summary">
            <div *ngIf="Data_3.length === 0" class="d-flex justify-content-center gap-2">
                <div class="col-4 d-flex flex-column justify-content-center align-items-center text-center">
                    <p-skeleton height="6rem" width="20rem" styleClass="mb-2" />
                </div>
                <div class="col-4 d-flex flex-column justify-content-center align-items-center text-center">
                    <p-skeleton height="6rem" width="20rem" styleClass="mb-2" />
                </div>
                <div class="col-4 d-flex flex-column justify-content-center align-items-center text-center">
                    <p-skeleton height="6rem" width="20rem" styleClass="mb-2" />
                </div>
            </div>
            <div *ngIf="Data_3.length > 0" class="d-flex justify-content-center gap-2">
                <div class="col-4 d-flex flex-column justify-content-center align-items-center text-center"> 
                    <i class="pi pi-home" style="font-size: 3rem"></i>
                    <h4 class="mt-3">Total Families: {{ Family }}</h4>
                </div>
                <div class="col-4 d-flex flex-column justify-content-center align-items-center text-center">
                    <i class="pi pi-users" style="font-size: 3rem"></i>
                    <h4 class="mt-3">Total Population: {{ Population }}</h4>
                </div>
                <div class="col-4 d-flex flex-column justify-content-center align-items-center text-center">
                    <i class="pi pi-inbox" style="font-size: 3rem"></i>
                    <h4 class="mt-3">Total Aids Members: {{ Aids }}</h4>
                </div>      
            </div>
        </p-card>
    </div>
    <div class="row mt-4 mb-3">
        <div class="col-4">
            <p-card header="AID's Status">
                <div *ngIf="Data_4.length === 0" style="text-align: center; padding: 1rem; display: flex; justify-content: center; align-items: center;">
                    <div class="flex">
                        <div class="row">
                            <p-skeleton shape="circle" size="23rem" />
                        </div>
                    </div>
                </div>
                <p-chart *ngIf="Data_4.length > 0" type="doughnut" [data]="data" [options]="options" />
            </p-card>
        </div>
        <div class="col-8">
            <p-card header="Population">
                <div *ngIf="labels.length === 0" style="text-align: center; padding: 1rem;">
                    <div class="row">
                        <p-skeleton height="23rem" />
                    </div>
                </div>
                <p-chart *ngIf="labels.length > 0" type="bar" [data]="MonthlyRateData" [options]="MonthlyOptions" />
            </p-card>
        </div>
    </div>
    <ngx-spinner bdcolor="rgba(0, 0, 0, 0.8)" size="medium" color="#fff" type="ball-scale-multiple" [fullScreen]="true"><p style="color: white"> Loading... </p></ngx-spinner>
</div>
