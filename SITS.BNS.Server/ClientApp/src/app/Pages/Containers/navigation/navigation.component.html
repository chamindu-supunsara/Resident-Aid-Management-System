<c-sidebar
  #sidebar1="cSidebar"
  class="d-print-none sidebar sidebar-fixed border-end"
  colorScheme="dark"
  id="sidebar1"
  [visible]="sidebarVisible">

  <c-sidebar-header class="border-bottom">
    <!-- <c-sidebar-brand 
        [brandFull]="{
            src: 'EMMA-Logo-new1.png',
            width: 100,
            height:  23.33,
            alt: 'EMMA Logo'
        }"/> -->
        <c-sidebar-brand>
            <span style="font-size: 2em; font-weight: bold; color: #ffffff;">
              GRAMA LINK
            </span>
        </c-sidebar-brand>
    </c-sidebar-header>

  <ng-scrollbar #scrollbar="ngScrollbar" (updated)="onScrollbarUpdate(scrollbar)" class="overflow" pointerEventsMethod="scrollbar" visibility="hover">
    <c-sidebar-nav #overflow [navItems]="navItems" dropdownMode="close" compact />
  </ng-scrollbar>
</c-sidebar>

<!--main-->
<div class="wrapper d-flex flex-column min-vh-100 bg-light dark:bg-transparent">
    <!--app-header-->
    <app-default-header class="mb-4 d-print-none header header-sticky" position="sticky" sidebarId="sidebar" />
    <!--app-body-->
    <div class="body flex-grow-1 px-3">
      <c-container breakpoint="lg" class="h-auto" style="display: contents;">
        <router-outlet />
      </c-container>
    </div>
    <!--app footer-->
    <app-default-footer />
</div>

<!-- Global Toast Container -->
<p-toast></p-toast>
