name: Create Pull Request to CICD_Main

on:
  push:
    branches:
      - Dev_Chathura

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: CICD_Main
          branch: Dev_Chathura
          title: "Merge Dev_Chathura → CICD_Main"
          body: |
            Automated PR created by GitHub Actions.
            Push detected on `Dev_Chathura` branch.
          draft: false