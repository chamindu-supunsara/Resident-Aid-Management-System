name: CI/CD — Resident Aid Management System

on:
  push:
    branches: [ CICD_Main ]
  pull_request:
    branches: [ CICD_Main ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: 'residentaid'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Build Angular
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Angular dependencies
        working-directory: SITS.BNS.Server/ClientApp
        run: npm install

      - name: Build Angular
        working-directory: SITS.BNS.Server/ClientApp
        run: npm run build -- --configuration production

      # 3. Setup .NET 
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 4. Restore NuGet packages
      - name: Restore NuGet packages
        run: dotnet restore SITS.BNS.sln

      # 5. Build solution
      - name: Build solution
        run: dotnet build SITS.BNS.sln --configuration Release --no-restore

      # 6. EF Core migrations
      - name: Install EF Core CLI tool
        run: dotnet tool install --global dotnet-ef

      - name: Run database migrations
        run: |
          dotnet ef database update \
            --project SITS.BNS.Infrastructure/SITS.BNS.Infrastructure.csproj \
            --startup-project SITS.BNS.Server/SITS.BNS.csproj \
            --configuration Release \
            --no-build
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      # 7. Publish app
      - name: Publish application
        run: |
          dotnet publish SITS.BNS.Server/SITS.BNS.csproj \
            --configuration Release \
            --output ./publish \
            --no-build

      # 8. Deploy to Azure
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish