name: CI/CD — Campus Project

on:
  push:
    branches: [ CICD_Main ]
  pull_request:
    branches: [ CICD_Main ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  AZURE_WEBAPP_NAME: 'residentaid'       # your App Service name from 2.5
  WEB_PROJECT_PATH: 'src/SITS.BNS.Server'           # path to your Web project
  INFRA_PROJECT_PATH: 'src/SITS.BNS.Infrastructure' # path to Infrastructure project
  ANGULAR_DIR: 'src/SITS.BNS.Server/ClientApp'      # path to Angular app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Get the code ───────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Build Angular 18 ───────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.ANGULAR_DIR }}/package-lock.json

      - name: Install Angular dependencies
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm ci

      - name: Build Angular 18 (production)
        working-directory: ${{ env.ANGULAR_DIR }}
        run: npm run build -- --configuration production

      # ── 3. Build .NET 8 ───────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      # ── 4. Run tests ──────────────────────────────────
      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      # ── 5. Run EF Core migrations ─────────────────────
      - name: Install EF Core CLI tool
        run: dotnet tool install --global dotnet-ef

      - name: Run database migrations
        run: |
          dotnet ef database update \
            --project ${{ env.INFRA_PROJECT_PATH }} \
            --startup-project ${{ env.WEB_PROJECT_PATH }} \
            --no-build
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      # ── 6. Publish .NET app ───────────────────────────
      - name: Publish application
        run: |
          dotnet publish ${{ env.WEB_PROJECT_PATH }} \
            --configuration Release \
            --output ./publish \
            --no-build
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

      # ── 7. Deploy to Azure ────────────────────────────
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish