name: CI/CD Pipeline

on:
  push:
    branches: [CICD]
  pull_request:
    branches: [CICD]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

# -------------------------------
# 1. BUILD JOB
# -------------------------------
  build:
    name: Build Angular + .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- Angular ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Angular dependencies
        working-directory: SITS.BNS.Server/ClientApp
        run: npm ci

      - name: Build Angular app
        working-directory: SITS.BNS.Server/ClientApp
        run: npm run build -- --configuration production

      # ---------------- .NET ----------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish .NET app
        run: dotnet publish SITS.BNS.Server/SITS.BNS.csproj -c Release -o publish

      # ---------------- COPY ANGULAR → WWWROOT ----------------
      - name: Copy Angular build to wwwroot
        run: |
          rm -rf publish/wwwroot
          mkdir -p publish/wwwroot
          cp -r SITS.BNS.Server/ClientApp/dist/sits.bns.client/browser/* publish/wwwroot/

      # ---------------- Upload artifact ----------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: publish/


# -------------------------------
# 2. DOCKER JOB
# -------------------------------
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build output
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: publish/

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB }}

      # Metadata (tags)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            latest

      # Build image (no push yet)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}

      # Security scan
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Push image
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Output tag
      - name: Set image tag
        id: set_output
        run: echo "image_tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT